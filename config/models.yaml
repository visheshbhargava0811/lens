# Model tier -> provider/model id (docs/02). Fill IDs after benchmarking; do not guess.
tiers:
  embedding:           { provider: local, model: BAAI/bge-m3 }   # benchmark vs multilingual-e5, LaBSE (Phase 2)
  reranker:            { provider: TBD, model: TBD }
  triage:              { provider: TBD, model: TBD, max_tokens: 512,  temperature: 0 }
  # Phase 6: same small model as analysis until the Ask eval says otherwise. Groq counts prompt +
  # max_tokens against 8k tokens/min, so a small budget allows several questions a minute.
  # Ask tiers run on the third key first (GROQ_API_KEY_3), so Ask and the pipeline stop competing (ADR-0032).
  query_understanding: { provider: groq, account: 3, model: openai/gpt-oss-20b, family: gpt-oss, max_tokens: 1024, temperature: 0, reasoning_effort: low }
  ask_synthesis:       { provider: groq, account: 3, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 4096, temperature: 0.2, reasoning_effort: low }
  ask_judge:           { provider: groq, account: 3, model: qwen/qwen3.8-27b, family: qwen, max_tokens: 2048, temperature: 0 }
  # Phase 4 (ADR-0022): provisional until the eval baseline; smoke-tested live 2026-09-23.
  # Groq free tier: 1000 requests/day and 8000 tokens/min per model. Constrained JSON-schema
  # decoding ("strict") is supported for gpt-oss-* and qwen3.8 on Groq.
  # gpt-oss models reason before answering; reasoning counts against max_tokens (hence 8192).
  # qwen/qwen3.8-27b returned empty claim lists on real stories (2026-09-23 comparison, ADR-0022).
  analysis:            { provider: groq, model: openai/gpt-oss-20b, family: gpt-oss, max_tokens: 8192, temperature: 0, reasoning_effort: low }
  synthesis:           { provider: groq, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 8192, temperature: 0.2, reasoning_effort: low }
  # Different family than synthesis (ADR-0024: Qwen replaced Sarvam when its credits ran out).
  # Groq checks prompt + max_tokens against the 8k tokens/min limit, so keep the budget at 2048.
  judge:               { provider: groq, model: qwen/qwen3.8-27b, family: qwen, max_tokens: 2048, temperature: 0 }
  # Ask localization (Phase 6): verified English answers rendered in Hindi; checked by G-OUT-06.
  translation:         { provider: groq, account: 3, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 4096, temperature: 0, reasoning_effort: low }
  tts:                 { provider: TBD, model: TBD }
# Tried in order when a tier's primary fails after its own retries: rate limit (or a retry-after
# too long to wait), outage, invalid output, or a missing key. Gemini free tier: 20 requests/day
# per model, so each model is its own fallback slot. `family` keeps the judge independent: a judge
# fallback of the same family as the summary that produced the text is skipped (fail closed).
fallbacks:
  # Order: the same Groq model on the second key (GROQ_API_KEY_2, its own quota), then the other
  # gpt-oss model on each key, then Gemini. Families stay separate so the judge remains independent.
  analysis:
    - { provider: groq, account: 2, model: openai/gpt-oss-20b, family: gpt-oss, max_tokens: 8192, temperature: 0, reasoning_effort: low }
    - { provider: groq, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 8192, temperature: 0, reasoning_effort: low }
    - { provider: groq, account: 2, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 8192, temperature: 0, reasoning_effort: low }
    - &gemini36 { provider: gemini, model: gemini-3.6-flash, family: gemini, max_tokens: 8192, temperature: 0, reasoning_effort: low }
    - &gemini35 { provider: gemini, model: gemini-3.5-flash, family: gemini, max_tokens: 8192, temperature: 0, reasoning_effort: low }
  query_understanding:
    - { provider: groq, model: openai/gpt-oss-20b, family: gpt-oss, max_tokens: 1024, temperature: 0, reasoning_effort: low }
    - { provider: groq, account: 2, model: openai/gpt-oss-20b, family: gpt-oss, max_tokens: 1024, temperature: 0, reasoning_effort: low }
    - *gemini36
    - *gemini35
  ask_synthesis:
    - { provider: groq, account: 3, model: openai/gpt-oss-20b, family: gpt-oss, max_tokens: 4096, temperature: 0.2, reasoning_effort: low }
    - { provider: groq, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 4096, temperature: 0.2, reasoning_effort: low }
    - { provider: groq, account: 2, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 4096, temperature: 0.2, reasoning_effort: low }
    - *gemini36
    - *gemini35
  translation:
    - { provider: groq, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 4096, temperature: 0, reasoning_effort: low }
    - *gemini36
  ask_judge:
    - { provider: groq, model: qwen/qwen3.8-27b, family: qwen, max_tokens: 2048, temperature: 0 }
    - { provider: groq, account: 2, model: qwen/qwen3.8-27b, family: qwen, max_tokens: 2048, temperature: 0 }
    - *gemini36
    - *gemini35
  synthesis:
    - { provider: groq, account: 2, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 8192, temperature: 0.2, reasoning_effort: low }
    - { provider: groq, model: openai/gpt-oss-20b, family: gpt-oss, max_tokens: 8192, temperature: 0.2, reasoning_effort: low }
    - { provider: groq, account: 2, model: openai/gpt-oss-20b, family: gpt-oss, max_tokens: 8192, temperature: 0.2, reasoning_effort: low }
    - *gemini36
    - *gemini35
  judge:
    - { provider: groq, account: 2, model: qwen/qwen3.8-27b, family: qwen, max_tokens: 2048, temperature: 0 }
    - *gemini36
    - *gemini35
    # Returns 402 until credits are topped up; failing fast costs nothing.
    - { provider: sarvam, model: sarvam-105b, family: sarvam, max_tokens: 16000, temperature: 0, reasoning_effort: low }
