# Model tier -> provider/model id (docs/02). Fill IDs after benchmarking; do not guess.
tiers:
  embedding:           { provider: local, model: BAAI/bge-m3 }   # benchmark vs multilingual-e5, LaBSE (Phase 2)
  reranker:            { provider: TBD, model: TBD }
  triage:              { provider: TBD, model: TBD, max_tokens: 512,  temperature: 0 }
  query_understanding: { provider: TBD, model: TBD, max_tokens: 512,  temperature: 0 }
  # Phase 4 (ADR-0022): provisional until the eval baseline; smoke-tested live 2026-09-23.
  # Groq free tier: 1000 requests/day and 8000 tokens/min per model. Constrained JSON-schema
  # decoding ("strict") is supported for gpt-oss-* and qwen3.8 on Groq.
  # gpt-oss models reason before answering; reasoning counts against max_tokens (hence 8192).
  # qwen/qwen3.8-27b returned empty claim lists on real stories (2026-09-23 comparison, ADR-0022).
  analysis:            { provider: groq, model: openai/gpt-oss-20b, family: gpt-oss, max_tokens: 8192, temperature: 0, reasoning_effort: low }
  synthesis:           { provider: groq, model: openai/gpt-oss-120b, family: gpt-oss, max_tokens: 8192, temperature: 0.2, reasoning_effort: low }
  # Different family than synthesis. Reasoning tokens count against max_tokens: keep it large.
  judge:               { provider: sarvam, model: sarvam-105b, family: sarvam, max_tokens: 16000, temperature: 0, reasoning_effort: low }
  translation:         { provider: TBD, model: TBD }
  tts:                 { provider: TBD, model: TBD }
# Tried in order when a tier's primary fails after its own retries: rate limit (or a retry-after
# too long to wait), outage, invalid output, or a missing key. Gemini free tier: 20 requests/day
# per model, so each model is its own fallback slot. `family` keeps the judge independent: a judge
# fallback of the same family as the summary that produced the text is skipped (fail closed).
fallbacks:
  analysis: &gemini
    - { provider: gemini, model: gemini-3.6-flash, family: gemini, max_tokens: 8192, temperature: 0, reasoning_effort: low }
    - { provider: gemini, model: gemini-3.5-flash, family: gemini, max_tokens: 8192, temperature: 0, reasoning_effort: low }
  synthesis: *gemini
  judge: *gemini
