# Starting values from docs/04. Tune on the clustering eval set and record results (reports/clustering_*.md).
window_hours: 72
candidates: 5                    # top stories (by cosine) scored per article
weights: { cos: 0.6, entity_jaccard: 0.2, time: 0.1, event_type: 0.1 }  # re-weighted over available features
time_decay_hours: 24             # time proximity = exp(-|article time - story last update| / decay)
thresholds: { high: 0.72, low: 0.62 }  # tuned on gold_v1 half A (was 0.82/0.68); reports/clustering_baseline.md
# Until a cluster-verifier model is configured (config/models.yaml `analysis`), borderline scores
# (low <= S < high) follow this policy and are counted as would-be verifier calls.
borderline_without_verifier: new_story   # new_story | assign
story_centroid_update: running_mean
lifecycle: { stable_after_hours: 24, archive_after_days: 7 }
reanalysis_trigger: { new_sources: 3, hours: 6 }
analysis:                        # LLM story analysis (ADR-0022)
  scheduled: false               # paused 2026-09-23 so Ask gets the free-tier quota (ADR-0030); `make analyze` still works
  min_sources: 4                 # only stories with a coverage bar
  max_articles: 12               # evidence cap per story (one article per outlet, balanced)
  max_stories_per_run: 10        # per pipeline pass; Groq free tier is 8k tokens/min per model
  max_seconds_per_run: 600       # stop starting new stories after this, so the 15-minute pass stays on time
batch:                           # nightly HDBSCAN pass: proposes merges only, never applies them
  days: 7
  min_cluster_size: 2
  min_samples: 1
  max_auto_story_size: 0         # docs/04: merges and splits need verifier approval
topics:                          # story topic tagging from centroids (lens.nlp.topic_embed); tuned in reports/topics_v1.md
  seed_min_votes: 2              # seed stories: >= this many member articles, all voting one keyword topic
  seed_max_per_topic: 2000
  mean_sample: 5000              # story centroids averaged to center vectors (BGE-M3 is anisotropic)
  min_sim: 0.28                  # tuned on gold_v1 half A (topical F1); held-out B: precision 0.86, F1 0.82
  min_margin: 0.0                # (keyword rules: 0.61 / 0.70). reports/topics_v1.md
