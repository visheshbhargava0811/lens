# Starting values from docs/07.
sensitive_topics:
  - communal_violence
  - election_model_code_period
  - sub_judice_court_matter
  - sexual_offence_case
  - minor_involved
  - health_scare
  - terror_incident
route_to_review_for: all     # precomputed + reviewed summaries only
# G-OUT-07 detector, deterministic first (docs/07): a story matches a topic when its headlines or
# summaries contain one of these terms (case-insensitive; Latin terms match whole words). Deliberately
# broad: a false positive only sends a summary to review, it never blocks it. Tune on the eval set.
sensitive_keywords:
  communal_violence: [communal, riot, riots, mob lynching, lynched, "सांप्रदायिक", "दंगा", "दंगे", "मॉब लिंचिंग", "जातीय हिंसा", "धार्मिक हिंसा"]
  election_model_code_period: [model code of conduct, "आचार संहिता"]
  sub_judice_court_matter: [sub judice, chargesheet, charge sheet, bail plea, "आरोप पत्र", "ज़मानत याचिका", "जमानत याचिका"]
  sexual_offence_case: [rape, raped, gangrape, gang-rape, sexual assault, molestation, molested, pocso, "बलात्कार", "दुष्कर्म", "गैंगरेप", "यौन उत्पीड़न", "छेड़छाड़", "अत्याचार"]
  minor_involved: [minor, minors, juvenile, "नाबालिग", "नाबालिग़", "अल्पवयीन"]
  health_scare: [outbreak, epidemic, pandemic, "महामारी", "प्रकोप"]
  terror_incident: [terror, terrorist, terrorists, terror attack, bomb blast, blasts, bombing, bombings, suicide bomber, "आतंकी", "आतंकवादी", "आतंकवाद", "बम धमाका", "धमाके", "दहशतवादी"]
min_sources_for_bar: 4
min_sources_for_blindspot: 6
feed_min_sources: 2            # feed and blindspot lists hide single-source stories (ADR-0018)
# Coverage stats and blindspots (docs/01, docs/04 section 11, ADR-0020). Starting values; tune later.
# The coverage bar counts distinct outlets by their *outlet-level* bias label from a third-party
# rater (Left / Center / Right), in the Ground News style. Outlets without a rating are "unrated".
stats:
  blindspot_bias_share: 0.70        # share of *rated* sources on one side (left, center or right)
  blindspot_language_share: 0.90    # share of sources in one language group ("near zero" in the other)
  language_groups: { en: [en] }     # every language not listed falls in group "indic"
  # Rater wording -> bucket (lowercased). Anything unlisted counts as unrated (never guessed).
  # Lean-left/right go to Left/Right, as Ground News groups them (ADR-0020).
  bias_value_map:
    extreme left: left
    left: left
    left-center: left
    least biased: center
    center: center
    right-center: right
    right: right
    extreme right: right
  # "Mostly Factual" -> mixed is the owner's conservative choice (ADR-0019).
  factuality_value_map:
    very high: high
    high: high
    mostly factual: mixed
    mixed: mixed
    low: low
    very low: low
  rated_share_confidence:           # bar and factuality confidence: share of the story's sources that are rated
    high_min_rated_share: 0.80
    medium_min_rated_share: 0.50

# Ask (Phase 6). G-IN-03: per client, fixed windows in Redis. Starting values; the free-tier LLM
# quota (ADR-0030) is the real ceiling, so keep these low.
ask:
  rate_per_minute: 3
  rate_per_day: 40
  min_language_confidence: 0.6     # G-IN-04: below this, answer in English and say so
  retention_days: 30               # ask_turns purge (docs/03, DPDP); raw queries are stored PII-masked
  max_judge_retries: 0             # G-GEN-03 fail -> prune flagged sentences at once (was 2 re-syntheses: judge-failed
                                   # asks took p50 34.9 s vs 4.6 s, and set p95; reports/ask_adversarial_v5.md)

# G-GEN-06 no false balance: an answer sentence this similar (BGE-M3 cosine) to a claim a fact-checker rated
# false or misleading is dropped unless it presents the fact-check. Starting value; tune on the ask suite.
false_balance: { min_similarity: 0.80 }

# Localization node (docs/06 node 13): answer languages besides English. Marathi joins after the benchmark.
localization:
  languages: [hi, mr]           # mr added after reports/translation_bench.md (gpt-oss-120b: 39/40 pass both checks)

# G-OUT-06 post-translation check (docs/07): numbers, attribution and named entities must survive. Entities are
# compared across scripts by consonant skeleton; these words are institutional, not names (English function words
# are built in), and are often translated rather than transliterated. Aliases are names that translate.
# Starting values: tuned on data/evals/translation (reports/translation_bench.md).
translation_check:
  skip_words: [officials, analysts, police, reports, election, minister, president, chief, prime, government, supreme,
    high, national, state, union, district, city, village, general, secretary, leader, opposition, home, finance,
    external, affairs, foreign, central, new, united, women, men, final, semi-final, day]
  # Heads of institution and event names: a capitalized phrase containing one ("Asian Games", "Election
  # Commission", "United States") is translated as a whole, so none of its words is checked. Titles are not here:
  # "Prime Minister Narendra Modi" must still check "Narendra" and "Modi".
  phrase_words: [court, commission, ministry, party, bank, department, council, assembly, university, board, army,
    force, navy, games, states, nations, amendment, standards, act, summit, cup, league, bill, scheme, mission,
    festival, awards, ceremony, conference, forum, bureau, trophy, championship, tournament, corridor, agreement,
    policy, report, ratings, class]
  aliases:   # matched as substrings, so a stem covers inflections (अमेरिक: अमेरिका, अमेरिकी)
    India: ["भारत"]
    Indian: ["भारत"]
    PM: ["प्रधानमंत्री", "पंतप्रधान", "पीएम"]
    US: ["अमेरिक"]
    U.S.: ["अमेरिक"]
    USA: ["अमेरिक"]
    America: ["अमेरिक"]
    American: ["अमेरिक"]
    UK: ["ब्रिटेन", "ब्रिटन", "यूके"]
    Britain: ["ब्रिटेन", "ब्रिटन"]
    UN: ["संयुक्त राष्ट्र", "यूएन"]
    EC: ["चुनाव आयोग", "निवडणूक आयोग", "ईसी"]
    CEC: ["मुख्य चुनाव आयुक्त", "मुख्य निवडणूक आयुक्त", "सीईसी"]
    NCP: ["राष्ट्रवादी", "एनसीपी"]

# G-OUT-03 defamation caution (docs/07): a sentence using an allegation term must carry an
# attribution marker, or it is dropped before the judge. Lowercase; Latin terms match whole words.
attribution:
  allegation_terms: [corrupt, corruption, bribe, bribery, scam, fraud, rigged, rigging, looted, embezzled, guilty,
    criminal, murdered, harassed, extortion, money laundering, "भ्रष्ट", "भ्रष्टाचार", "घोटाला", "घूस", "रिश्वत",
    "धोखाधड़ी", "हेराफेरी", "दोषी"]
  markers: [according to, said, says, alleged, allegedly, accused, accuses, claimed, claims, charged, charges,
    told, reported, reports, fir, complaint, denied, denies, "आरोप", "कहा", "के अनुसार", "मुताबिक", "दावा",
    "शिकायत", "एफआईआर"]
