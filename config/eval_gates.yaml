# CI gates from docs/08, enforced by `python -m lens.ops.gate` (ADR-0039). Each gate names the eval
# suite that measures it (`make eval`, reports/eval/<suite>.json). `pending` gates have no suite yet:
# they are listed, never silently passed. Thresholds only ratchet upward; delta gates compare with
# reports/eval/baseline.json (`make eval-baseline`).
gates:
  quote_match_rate:          { suite: stored_outputs, min: 1.00 }
  citation_presence:         { suite: ask, min: 1.00 }
  adversarial_pass_rate:     { suite: ask, min: 0.95 }
  benign_false_block_rate:   { suite: ask, max: 0.03 }
  p95_ask_latency_s:         { suite: ask, max: 15 }
  retrieval_recall_at_10:    { suite: retrieval, min_delta_vs_baseline: -0.02 }
  clustering_bcubed_f1:      { suite: clustering, min_delta_vs_baseline: -0.02 }
  langid_heldout_accuracy:   { suite: langid, min_delta_vs_baseline: -0.02 }
  topics_f1:                 { suite: topics, min_delta_vs_baseline: -0.02 }
  factcheck_same_claim_precision: { suite: factcheck, min: 0.90 }   # precision first (docs/12 Phase 8); recall reported
  faithfulness_judge:        { suite: golden_answers, min: 0.95, pending: "needs the owner-labeled golden_answers dataset (docs/08)" }
  stance_masked_consistency: { suite: stance, min: 0.95, pending: "no stance model; coverage uses outlet ratings (ADR-0020)" }


# docs/08 review loop (lens.ops.annotation): failed guard runs go to the LangSmith annotation queue.
annotation:
  sweep_hours: 48                  # look-back per sweep; runs already queued are skipped

# docs/08 online evaluators (lens.ops.online_eval), run by the pipeline worker every pass.
online_eval:
  sample_pct: 20                   # deterministic share of Ask turns scored
  judge_per_pass: 2                # LLM faithfulness re-checks per pass; Ask keeps the free-tier quota
  lookback_hours: 24               # turns older than this are never evaluated
  min_samples_for_alert: 5
  floors: { citation_presence: 1.0, premise_handled: 0.95, faithfulness: 0.95 }   # 24 h mean; below logs an alert
