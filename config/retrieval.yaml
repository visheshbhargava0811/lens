# Starting values from docs/05. Tune on the retrieval eval set.
tier1:
  window_days: 30
  top_stories: 3
  min_score: 0.35
tier2:
  dense_limit: 50
  sparse_limit: 50
  fused_limit: 100
  rerank_top_k: 20
  rerank: colbert            # colbert | cross_encoder | none
balance:
  max_chunks: 12
  per_source_cap: 2
  ensure_stance_buckets: true
  ensure_language_groups: true
  collapse_syndicated: true
retry:
  max_attempts: 2
  widen_window_days: [30, 90]
freshness:
  enabled: true
  timeout_s: 8
  max_articles: 20
