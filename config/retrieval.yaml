# Starting values from docs/05. Tune on the retrieval eval set.
tier1:
  window_days: 30
  top_stories: 3
  min_score: 0.66            # story cosine; 0.35 never abstained (ADR-0029); re-tune with more no-answer queries
tier2:
  mode: dense                # dense | hybrid. Hybrid lost the ablation (ADR-0029)
  dense_limit: 50
  sparse_limit: 50
  fused_limit: 100
  rrf_k: 60                  # Qdrant's default is 2; 60 is the common choice. Tuned in the ablation
  rerank_top_k: 20           # candidates passed to balancing (no reranker: ADR-0029)
  min_score: 0.58            # global fallback: best chunk cosine to keep (ablation Youden 0.582, ADR-0029)
  rerank: none               # none | colbert. ColBERT gave no gain at ~10 s (ADR-0029); cross-encoder dropped (ADR-0028)
balance:
  max_chunks: 12
  per_source_cap: 2
  ensure_bias_buckets: true   # left / center / right / unrated (ADR-0020)
  ensure_language_groups: true
  collapse_syndicated: true
retry:
  max_attempts: 2
  widen_window_days: [30, 90]
freshness:
  enabled: true
  timeout_s: 3
  max_articles: 20
  stale_hours: 6             # G-EV-04: newest evidence older than this triggers freshness once, then a "latest report" note
