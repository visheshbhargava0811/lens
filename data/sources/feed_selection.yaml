# Outlets with no usable machine-readable access on 2026-09-21. Seeded inactive with the reason.
inactive:
  ndtv: "Homepage and robots.txt return HTTP 403 to automated clients (checked with an honest user agent). Needs publisher permission, a license or a licensed news API."
  news18: "Returns HTTP 403 to our crawler's user agent; robots.txt also disallows AI crawlers (GPTBot, ChatGPT-User, CCBot). Treat as no permission."
  business-standard: "Homepage and robots.txt return HTTP 403 (Akamai) to automated clients. Needs publisher permission, a license or a licensed news API."
  the-telegraph: "Homepage and robots.txt return HTTP 403 (Akamai) to automated clients. Needs publisher permission, a license or a licensed news API."
  the-wire: "Site reachable, but no RSS feed or news sitemap advertised on the homepage or in robots.txt."
  lokmat: "Site reachable, but no RSS feed or news sitemap advertised on the homepage or in robots.txt."

