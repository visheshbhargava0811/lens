[project]
name = "lens"
version = "0.1.0"
description = "Lens backend: AI news comparison platform for India"
authors = [
    { name = "Vishesh Bhargava", email = "vishub0811@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3",
    "langsmith>=0.13.0",
    "lingua-language-detector>=2.2.0",
    "numpy>=2.5.3",
    "protego>=0.7.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "redis>=5.3.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
ml = [
    "flagembedding>=1.4.2",
    "torch>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test data (headlines, feeds, seed entries) reads better unwrapped.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["lens.schemas.*", "lens.guardrails.*", "lens.retrieval.*", "lens.stats.*"]
strict = true

[[tool.mypy.overrides]]
module = ["arq.*", "feedparser.*", "sklearn.*", "FlagEmbedding.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
  "live: hits real external services (LLMs, LangSmith). Deselected by default.",
  "db: needs the local Postgres from infra/docker-compose.yml.",
]
asyncio_mode = "auto"
